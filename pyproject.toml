[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "yapper.py"
version = "1.8.5"
authors = [
  { name="LeAndre C.", email="leandre@lecanact.me" },
]
description = "An Unofficial Python Library for creating Yapin' Bots"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "python-dotenv>=1.2.4",
]
keywords = [
    "yapper.py",
    "yapin.py",
    "discord.py",
    "yapper",
    "yapin"
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "GPL-3.0-only"
license-files = ["LICEN[CS]E*"]

[project.optional-dependencies]
voice = [
    "livekit>=1.3.0",
    "cryptography>=50.0.2"
]
test = [
    "coverage>=7.0",
    "pickledb>=1.6",   # the telemetry server tests (server/) use it
    "pillow>=13.0.0",
]

[project.urls]
Repository = "https://github.com/our-websites/yapper.py"
Issues = "https://github.com/our-websites/yapper.py/issues"
Documentation = "https://yapin.gg/developers"

[tool.setuptools.packages.find]
where = ["src"]

[tool.coverage.run]
branch = true
source = ["src/yapper"]

[tool.coverage.xml]
output = "coverage.xml"
